<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajawali Wings — Archipelago Air Race</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08131c; }
  #stage { position: fixed; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Rajawali Wings: a 3D flight game over a volcanic archipelago. Fly the gold gates, then land on the runway."></canvas>
  <canvas id="hud" width="1280" height="720"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
